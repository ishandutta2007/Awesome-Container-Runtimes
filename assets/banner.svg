<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Animated Background Elements (Soft glowing blobs & orbital nodes) -->
  <g opacity="0.45">
    <!-- Top-Left Cyan Pulsing Blob -->
    <circle cx="150" cy="80" r="130" fill="url(#cyanGlow)">
      <animate attributeName="r" values="110;140;110" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="140;170;140" dur="10s" repeatCount="indefinite" />
    </circle>
    <!-- Bottom-Right Purple Pulsing Blob -->
    <circle cx="1060" cy="280" r="140" fill="url(#purpleGlow)">
      <animate attributeName="r" values="120;155;120" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="270;300;270" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Background Data Stream Line Animation -->
  <g opacity="0.25">
    <path d="M 0 120 Q 300 180, 600 120 T 1200 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 0 250 Q 400 200, 800 270 T 1200 230" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="200" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Container Box Decorative Icons in subtle background -->
  <g transform="translate(1020, 50)" opacity="0.35">
    <!-- 3D Cube / Container Isometric Outline -->
    <path d="M40 0 L80 22 L40 44 L0 22 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M0 22 L40 44 L40 88 L0 66 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M80 22 L40 44 L40 88 L80 66 Z" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="1020,50; 1020,40; 1020,50" dur="6s" repeatCount="indefinite" />
  </g>

  <g transform="translate(90, 230)" opacity="0.35">
    <!-- Secondary small isometric box -->
    <path d="M30 0 L60 16 L30 32 L0 16 Z" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M0 16 L30 32 L30 64 L0 48 Z" fill="#7e22ce" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M60 16 L30 32 L30 64 L60 48 Z" fill="#6b21a8" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.2"/>
    <animateTransform attributeName="transform" type="translate" values="90,230; 90,240; 90,230" dur="5s" repeatCount="indefinite" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-110" cy="-1" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2">
      CLOUD-NATIVE &amp; OCI ECOSYSTEM
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Crisp, High-Contrast Gradient) -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGradient)" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome Container Runtimes
  </text>
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGradient)" letter-spacing="-0.5">
    Awesome Container Runtimes
  </text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
    Curated Guide to OCI Runtimes, MicroVMs, Sandboxes, CRI Implementations &amp; Container Engines
  </text>

  <!-- FOREGROUND CONTENT: Feature Highlights Bar (Pills clearly in foreground) -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <!-- Pill 1: OCI Specs -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ runc &amp; crun</text>
    </g>

    <!-- Pill 2: Kubernetes CRI -->
    <g transform="translate(-180, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">☸️ containerd &amp; CRI-O</text>
    </g>

    <!-- Pill 3: Sandboxing & MicroVMs -->
    <g transform="translate(15, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a855f7">🛡️ Kata, gVisor &amp; Firecracker</text>
    </g>

    <!-- Pill 4: Daemonless & Tools -->
    <g transform="translate(215, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f472b6">🦭 Podman, Buildah &amp; Skopeo</text>
    </g>

    <!-- Pill 5: WebAssembly -->
    <g transform="translate(390, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399">🕸️ WasmEdge &amp; Youki</text>
    </g>
  </g>

  <!-- Border Highlight Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>
